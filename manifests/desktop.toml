# KLOS desktop: a Wayland desktop with the sway compositor and the foot
# terminal. The kernel has modules for hardware. Read docs/desktop.md.
include = ["base"]

[flavor]
name = "desktop"
description = "Wayland desktop (sway)"
slot-size = "2G"

[kernel]
config = ["desktop"]
# The last console is /dev/console. A desktop has a screen.
cmdline = ["console=ttyS0,115200", "console=tty0"]

[packages]
install = ["kmod", "seatd", "mesa", "sway", "swaybg", "foot", "font-dejavu",
  "xkeyboard-config", "linux-firmware", "wireless-regdb", "vulkan-loader",
  "vulkan-tools", "pipewire", "pipewire-media-session", "alsa-utils", "firefox"]

[services]
enable = ["devd", "seatd"]

[rootfs]
overlays = ["desktop"]
# Build tools of glib (Python scripts). The OS does not need them.
exclude = ["usr/bin/glib-mkenums", "usr/bin/glib-genmarshal",
  "usr/bin/gdbus-codegen", "usr/bin/gtester-report", "usr/share/glib-2.0/codegen/*",
  "usr/share/glib-2.0/gdb/*", "usr/share/gdb/*", "usr/bin/glib-gettextize",
  "usr/share/glib-2.0/gettext/*", "usr/bin/cairo-trace", "usr/lib/cairo/*"]
# llvm-target: the image gets only libLLVM.so (llvmpipe and radeonsi use it).
# The tools and the clang libraries are only for builds (mesa_clc).
package-exclude = ["llvm-target:usr/bin/*", "llvm-target:usr/lib/libclang*",
  "llvm-target:usr/lib/clang/*", "llvm-target:usr/lib/libLTO.so*",
  "llvm-target:usr/lib/libRemarks.so*", "llvm-target:usr/lib/LLVMgold.so",
  "llvm-target:usr/share/*"]

[[groups]]
name = "audio"
gid = 29
[[groups]]
name = "video"
gid = 44
[[groups]]
name = "input"
gid = 97

# The test runs sway with the headless back end, as the test user "klos"
# (UID 1000): first with the pixman renderer, then with the GLES2 renderer
# on the virtio GPU (without virgl on the host, Mesa uses llvmpipe).
[selinux]
policy = ["desktop.cil"]
file-contexts = ["desktop.fc"]

[test]
# A sound card (HDA) without sound output on the host.
qemu-args = ["-device", "virtio-gpu-pci", "-audiodev", "none,id=snd0",
  "-device", "ich9-intel-hda", "-device", "hda-output,audiodev=snd0"]
# A desktop computer often has a graphics card with an option ROM.
secureboot = "enroll-microsoft"
commands = [
  "pidof seatd && lsmod | grep -q virtio_net",
  "id klos | grep -q video && test -d /run/user/1000",
  "setpriv --reuid=1000 --regid=1000 --init-groups env HOME=/home/klos XDG_RUNTIME_DIR=/run/user/1000 WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 sway > /tmp/sway.log 2>&1 & for i in $(seq 30); do [ -S /run/user/1000/wayland-1 ] && break; sleep 1; done; ls /run/user/1000/wayland-1 || { cat /tmp/sway.log; false; }",
  "setpriv --reuid=1000 --regid=1000 --init-groups env XDG_RUNTIME_DIR=/run/user/1000 SWAYSOCK=$(ls /run/user/1000/sway-ipc.*.sock) swaymsg -t get_version",
  "foot --version && fc-list | grep -qi dejavu",
  "ls /usr/lib/firmware/amdgpu/*.zst /usr/lib/firmware/i915/*.zst /usr/lib/firmware/intel/iwlwifi/*.zst >/dev/null",
  # cfg80211 with a country makes the kernel load regulatory.db (firmware)
  # and check its signature. Success is silent; a failure, a bad signature
  # or a LoadPin denial gives a message.
  "modprobe -r cfg80211; modprobe cfg80211 ieee80211_regdom=SE && sleep 5 && grep -qx SE /sys/module/cfg80211/parameters/ieee80211_regdom && ! dmesg | grep -iE 'failed to load regulatory.db|regulatory.db is malformed|LoadPin: .*denied'",
  "for i in radeon intel lvp virtio; do test -f /usr/share/vulkan/icd.d/${i}_icd.x86_64.json || { echo no ICD $i; false; }; done",
  # The SELinux domains of the desktop: the session is user_t.
  "grep -q ':user_t:' /proc/$(pidof sway)/attr/current && grep -q ':seatd_t:' /proc/$(pidof seatd)/attr/current && grep -q ':devd_t:' /proc/$(pgrep -f 'klos devd')/attr/current || { for p in $(pidof sway) $(pidof seatd) $(pgrep -f 'klos devd'); do cat /proc/$p/attr/current; echo; done; false; }",
  "klos selinux show /dev/dri/* | grep -q dri_device_t || { klos selinux show /dev/dri/*; false; }",
  # vulkaninfo runs in the session (user_t has executable memory for the
  # JIT compiler of lavapipe; init_t has not).
  "setpriv --reuid=1000 --regid=1000 --init-groups env XDG_RUNTIME_DIR=/run/user/1000 SWAYSOCK=$(ls /run/user/1000/sway-ipc.*.sock) swaymsg exec 'vulkaninfo --summary > /tmp/vulkaninfo.txt 2>&1' && for i in $(seq 60); do grep -q 'llvmpipe' /tmp/vulkaninfo.txt 2>/dev/null && break; sleep 1; done; grep -q 'llvmpipe' /tmp/vulkaninfo.txt || { cat /tmp/vulkaninfo.txt; false; }",
  "for d in iris crocus radeonsi nouveau virtio_gpu llvmpipe; do strings /usr/lib/libgallium-*.so | grep -qx $d || { echo no driver $d; false; }; done",
  # Sound: sway starts PipeWire, PipeWire starts the session manager. An
  # ALSA program (aplay) plays through PipeWire to the HDA sound card.
  "for i in $(seq 30); do pidof pipewire-media-session >/dev/null && [ -S /run/user/1000/pipewire-0 ] && break; sleep 1; done; pidof pipewire && pidof pipewire-media-session && grep -q ':user_t:' /proc/$(pidof pipewire-media-session)/attr/current || { ls -la /run/user/1000; false; }",
  "for i in $(seq 30); do setpriv --reuid=1000 --regid=1000 --init-groups env XDG_RUNTIME_DIR=/run/user/1000 pw-dump 2>/dev/null | grep -q '\"Audio/Sink\"' && break; sleep 1; done; setpriv --reuid=1000 --regid=1000 --init-groups env XDG_RUNTIME_DIR=/run/user/1000 pw-dump | grep -q '\"Audio/Sink\"' || { cat /proc/asound/cards; setpriv --reuid=1000 --regid=1000 --init-groups env XDG_RUNTIME_DIR=/run/user/1000 pw-cli ls Node; false; }",
  "(head -c 1920000 /dev/urandom | setpriv --reuid=1000 --regid=1000 --init-groups env XDG_RUNTIME_DIR=/run/user/1000 aplay -q -t raw -f S16_LE -c 2 -r 48000) & sleep 4; grep -q RUNNING /proc/asound/card0/pcm*p/sub0/status || { cat /proc/asound/card0/pcm*p/sub0/status; false; }; wait",
  # Firefox in the session (user_t): a headless screenshot of a page.
  "setpriv --reuid=1000 --regid=1000 --init-groups env XDG_RUNTIME_DIR=/run/user/1000 SWAYSOCK=$(ls /run/user/1000/sway-ipc.*.sock) swaymsg exec 'firefox --headless --screenshot /tmp/firefox.png \"data:text/html,<h1>KLOS</h1>\" > /tmp/firefox.log 2>&1' && for i in $(seq 180); do [ -s /tmp/firefox.png ] && break; sleep 1; done; head -c 8 /tmp/firefox.png | grep -q PNG || { tail -30 /tmp/firefox.log; false; }",
  "pkill pipewire; pkill sway; sleep 1; setpriv --reuid=1000 --regid=1000 --init-groups env HOME=/home/klos XDG_RUNTIME_DIR=/run/user/1000 WLR_BACKENDS=headless WLR_RENDERER=gles2 WLR_LIBINPUT_NO_DEVICES=1 sway -d > /tmp/sway-gl.log 2>&1 & for i in $(seq 30); do grep -q 'GL renderer' /tmp/sway-gl.log && break; sleep 1; done; grep 'GL renderer' /tmp/sway-gl.log | grep -q llvmpipe || { grep -iE 'egl|gl|error' /tmp/sway-gl.log | tail -20; false; }",
]
