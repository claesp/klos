# KLOS desktop: a Wayland desktop with the sway compositor and the foot
# terminal. The kernel has modules for hardware. Read docs/desktop.md.
include = ["base"]

[flavor]
name = "desktop"
description = "Wayland desktop (sway)"
slot-size = "2G"

[kernel]
config = ["desktop"]
# The last console is /dev/console. A desktop has a screen.
cmdline = ["console=ttyS0,115200", "console=tty0"]

[packages]
install = ["kmod", "seatd", "mesa", "sway", "swaybg", "foot", "font-dejavu",
  "xkeyboard-config"]

[services]
enable = ["devd", "seatd"]

[rootfs]
overlays = ["desktop"]
# Build tools of glib (Python scripts). The OS does not need them.
exclude = ["usr/bin/glib-mkenums", "usr/bin/glib-genmarshal",
  "usr/bin/gdbus-codegen", "usr/bin/gtester-report", "usr/share/glib-2.0/codegen/*",
  "usr/share/glib-2.0/gdb/*", "usr/share/gdb/*", "usr/bin/glib-gettextize",
  "usr/share/glib-2.0/gettext/*", "usr/bin/cairo-trace", "usr/lib/cairo/*"]

[[groups]]
name = "audio"
gid = 29
[[groups]]
name = "video"
gid = 44
[[groups]]
name = "input"
gid = 97

# The test runs sway with the headless back end and the pixman renderer,
# as the test user "klos" (UID 1000).
[test]
commands = [
  "pidof seatd && lsmod | grep -q virtio_net",
  "id klos | grep -q video && test -d /run/user/1000",
  "setpriv --reuid=1000 --regid=1000 --init-groups env HOME=/home/klos XDG_RUNTIME_DIR=/run/user/1000 WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 sway > /tmp/sway.log 2>&1 & for i in $(seq 30); do [ -S /run/user/1000/wayland-1 ] && break; sleep 1; done; ls /run/user/1000/wayland-1 || { cat /tmp/sway.log; false; }",
  "setpriv --reuid=1000 --regid=1000 --init-groups env XDG_RUNTIME_DIR=/run/user/1000 SWAYSOCK=$(ls /run/user/1000/sway-ipc.*.sock) swaymsg -t get_version",
  "foot --version && fc-list | grep -qi dejavu",
]
