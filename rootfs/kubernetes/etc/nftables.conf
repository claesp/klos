#!/usr/bin/nft -f
# The KLOS Kubernetes node firewall. kube-proxy (nftables mode) and the CNI
# plugin add their own tables. Change the ports for your cluster.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif "lo" accept
		meta l4proto ipv6-icmp accept
		ip protocol icmp accept
		udp dport 546 ip6 saddr fe80::/10 accept
		tcp dport 22 ct state new limit rate 30/minute accept
		# API server, etcd, kubelet, scheduler, controller manager.
		tcp dport { 6443, 2379-2380, 10250, 10257, 10259 } accept
		# NodePort services.
		tcp dport 30000-32767 accept
		udp dport 30000-32767 accept
		# Pod network overlays: VXLAN, Geneve and WireGuard.
		udp dport { 4789, 6081, 8472, 51820, 51821 } accept
		# Traffic from pods (the usual CNI interface names).
		iifname { "cni*", "cali*", "cilium*", "lxc*", "flannel*", "vxlan*", "veth*" } accept
	}
	chain forward {
		type filter hook forward priority filter; policy accept;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
