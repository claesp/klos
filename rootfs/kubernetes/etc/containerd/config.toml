# containerd for Kubernetes: the CRI plugin with crun and the CNI plugins.
version = 3
root = "/var/lib/containerd"
state = "/run/containerd"

[grpc]
  address = "/run/containerd/containerd.sock"

# The pause image of the package kubernetes-images (imported by the
# service k8s-images).
[plugins."io.containerd.cri.v1.images".pinned_images]
  sandbox = "klos.local/pause:3.10.2"

[plugins."io.containerd.cri.v1.runtime"]
  # containerd gives each pod container_t and its own MCS categories
  # (read docs/selinux.md).
  enable_selinux = true
  [plugins."io.containerd.cri.v1.runtime".containerd]
    default_runtime_name = "crun"
    [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.crun]
      runtime_type = "io.containerd.runc.v2"
      [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.crun.options]
        BinaryName = "/usr/bin/crun"
        SystemdCgroup = false
  [plugins."io.containerd.cri.v1.runtime".cni]
    bin_dirs = ["/usr/lib/cni"]
    conf_dir = "/etc/cni/net.d"
