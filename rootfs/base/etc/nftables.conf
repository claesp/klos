#!/usr/bin/nft -f
# The default KLOS firewall: drop all incoming traffic except SSH, ICMP,
# DHCPv6 replies and the replies to outgoing connections.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif "lo" accept
		meta l4proto ipv6-icmp accept
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
		udp dport 546 ip6 saddr fe80::/10 accept
		tcp dport 22 ct state new limit rate 30/minute accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
