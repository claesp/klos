# GitHub makes the archive from the tag xkbcommon-1.13.2.
[package]
name = "libxkbcommon"
version = "1.13.2"
summary = "Keyboard keymap library"
license = "MIT"
homepage = "https://xkbcommon.org/"
depends = ["xkeyboard-config"]
build-depends = ["wayland", "wayland-protocols"]
# Upstream does not sign this release. The SHA-256 is pinned.

[package.options]
run-tools = ["wayland-scanner"]

[[source]]
url = "https://github.com/xkbcommon/libxkbcommon/archive/refs/tags/xkbcommon-1.13.2.tar.gz"
filename = "libxkbcommon-1.13.2.tar.gz"
sha256 = "acc4d5f7c3cbba5f9f8d08d8bdbeede84ecede46792f47929aa9321873385528"

[build]
script = '''
kmeson -Denable-x11=false -Denable-docs=false -Denable-wayland=true -Denable-xkbregistry=false -Denable-tools=false -Dxkb-config-root=/usr/share/X11/xkb -Dx-locale-root=/usr/share/X11/locale
kninja
kninja_install
'''
