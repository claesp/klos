[package]
name = "pixman"
version = "0.46.4"
summary = "Pixel manipulation library"
license = "MIT"
homepage = "https://pixman.org/"

# Upstream signs a SHA-512 checksum list (a signed OpenPGP message).
[[source]]
url = "https://cairographics.org/releases/pixman-0.46.4.tar.xz"
sha256 = "a098c33924754ad43f981b740f6d576c70f9ed1006e12221b1845431ebce1239"
signature = "https://cairographics.org/releases/pixman-0.46.4.tar.xz.sha512.asc"
signature-type = "pgp-checksums"
key = ["pixman-cairo"]

[build]
script = '''
kmeson -Dtests=disabled -Dgtk=disabled -Dlibpng=disabled -Ddemos=disabled
kninja
kninja_install
'''
