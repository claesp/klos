# The KLOS cross toolchain, part 1: Clang, lld and the LLVM tools. It runs in
# the builder and makes code for the KLOS target (x86_64-unknown-linux-musl).
# The C and C++ compilers of the builder (host-cc and host-cxx in
# /etc/klos-builder.conf) compile it. Part 2 is the package
# compiler-rt. kbuild puts the two packages together in one directory.
[package]
name = "llvm"
version = "23.1.4"
summary = "Clang, lld and LLVM tools"
license = "Apache-2.0 WITH LLVM-exception"
homepage = "https://llvm.org/"
kind = "host"

[[source]]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/llvm-project-23.1.4.src.tar.xz"
sha256 = "819ecf7351f1a66f76b2d701d8942faaf5faeb324cb90c9d5b090de142434bb2"
signature = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/llvm-project-23.1.4.src.tar.xz.sig"
key = ["llvm"]

[build]
script = '''
# Stage 1: the compiler, the linker and the binary tools.
cmake -S llvm -B build -G Ninja \
	-DCMAKE_BUILD_TYPE=Release \
	-DCMAKE_INSTALL_PREFIX="$PREFIX" \
	-DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
	-DLLVM_USE_LINKER=lld \
	-DLLVM_ENABLE_PROJECTS="clang;lld" \
	-DLLVM_TARGETS_TO_BUILD="X86;BPF" \
	-DLLVM_DEFAULT_TARGET_TRIPLE="$TARGET" \
	-DCLANG_DEFAULT_RTLIB=compiler-rt \
	-DCLANG_DEFAULT_UNWINDLIB=libunwind \
	-DCLANG_DEFAULT_CXX_STDLIB=libc++ \
	-DCLANG_DEFAULT_LINKER=lld \
	-DCLANG_DEFAULT_PIE_ON_LINUX=ON \
	-DCLANG_ENABLE_STATIC_ANALYZER=OFF \
	-DLLVM_INSTALL_TOOLCHAIN_ONLY=ON \
	-DLLVM_INCLUDE_TESTS=OFF -DLLVM_APPEND_VC_REV=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
	-DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_DOCS=OFF \
	-DLLVM_ENABLE_LIBXML2=OFF -DLLVM_ENABLE_LIBEDIT=OFF \
	-DLLVM_ENABLE_ZLIB=ON -DLLVM_ENABLE_ZSTD=ON \
	-DLLVM_PARALLEL_LINK_JOBS=4
ninja -C build -j"$JOBS"
DESTDIR="$DESTDIR" ninja -C build install

'''
