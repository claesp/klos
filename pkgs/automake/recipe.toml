# GNU Automake. A build tool of the KLOS builder (manifests/builder.toml).
# The images do not contain it.
[package]
name = "automake"
version = "1.19"
summary = "GNU Automake"
license = "GPL-2.0-or-later"
homepage = "https://www.gnu.org/software/automake/"

[[source]]
url = "https://ftpmirror.gnu.org/gnu/automake/automake-1.19.tar.xz"
sha256 = "e3e2c2e3abf37898138db5b6c1d1dc35c9160c5978be7947d2c741705251d445"
signature = "https://ftpmirror.gnu.org/gnu/automake/automake-1.19.tar.xz.sig"
key = ["gnu-iczelia"]

[build]
script = '''
PERL=/usr/bin/perl kconfigure
kmake
make DESTDIR="$DESTDIR" install
'''
