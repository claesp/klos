[package]
name = "libnftnl"
version = "1.3.2"
summary = "Netlink interface to the nf_tables subsystem"
license = "GPL-2.0-or-later"
homepage = "https://www.netfilter.org/projects/libnftnl/"
build-depends = ["libmnl"]

[[source]]
url = "https://www.netfilter.org/projects/libnftnl/files/libnftnl-1.3.2.tar.xz"
sha256 = "c97abc3409f8fa396b4462b2bb7f147a3a47a4ddc97cfa0b2f18890c9cfde8b0"
signature = "https://www.netfilter.org/projects/libnftnl/files/libnftnl-1.3.2.tar.xz.sig"
key = ["netfilter-pablo"]

[build]
script = '''
kconfigure --disable-static
kmake
make DESTDIR="$DESTDIR" install
'''
