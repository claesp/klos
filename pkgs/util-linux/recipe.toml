# Only the libraries and the commands that KLOS needs. No setuid programs.
[package]
name = "util-linux"
version = "2.42.4"
summary = "Block device, mount and namespace tools and libraries"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later AND BSD-3-Clause"
homepage = "https://github.com/util-linux/util-linux"

[[source]]
url = "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.4.tar.xz"
sha256 = "fbd62a100ab7bb8746ba0661255c3c48185b1e9021507c624da01fbc696330ec"
signature = "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.4.tar.sign"
signed-content = "uncompressed"
key = ["util-linux-kzak"]

[build]
script = '''
kconfigure --bindir=/usr/bin --disable-static \
	--disable-all-programs \
	--enable-libuuid --enable-libblkid --enable-libmount \
	--enable-libsmartcols --enable-libfdisk \
	--enable-blkid --enable-mount --enable-losetup --enable-lsblk \
	--enable-findmnt --enable-wipefs --enable-sfdisk --enable-fdisk \
	--enable-nsenter --enable-unshare --enable-fstrim --enable-mkswap \
	--enable-swapon --enable-flock --enable-uuidgen --enable-blkdiscard \
	--enable-switch_root --enable-pivot_root \
	--disable-makeinstall-chown --disable-makeinstall-setuid \
	--disable-bash-completion --disable-poman --disable-liblastlog2 \
	--without-python --without-systemd --without-udev --without-ncurses \
	--without-ncursesw --without-tinfo --without-readline --without-libz \
	--without-cap-ng --without-btrfs --without-sqlite3 --without-econf \
	--without-selinux --without-audit --without-user --without-cryptsetup
kmake
make DESTDIR="$DESTDIR" install
'''
