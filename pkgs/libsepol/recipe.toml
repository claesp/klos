# The SELinux policy library. A build tool: secilc uses it to compile the
# KLOS SELinux policy. The images do not contain it.
[package]
name = "libsepol"
version = "3.11"
summary = "SELinux binary policy library"
license = "LGPL-2.1-or-later"
homepage = "https://github.com/SELinuxProject/selinux"

[[source]]
url = "https://github.com/SELinuxProject/selinux/releases/download/3.11/libsepol-3.11.tar.gz"
sha256 = "79f3d2c88f44b7eb5cf54d9792e03232297e17f97a179163f2750099a00f164d"
signature = "https://github.com/SELinuxProject/selinux/releases/download/3.11/libsepol-3.11.tar.gz.asc"
key = ["selinux-lautrbach"]

[build]
script = '''
kmake PREFIX=/usr LIBDIR=/usr/lib SHLIBDIR=/usr/lib
make PREFIX=/usr LIBDIR=/usr/lib SHLIBDIR=/usr/lib DESTDIR="$DESTDIR" install
rm -rf "$DESTDIR/usr/share/man" "$DESTDIR/usr/bin"
'''

[watch]
# The old tags (before 2.x) have dates.
ignore = '^20'
