# The Go toolchain (host tool) for Go programs in KLOS. This is the
# official binary release; go.dev publishes the SHA-256 values.
[package]
name = "go"
version = "1.27.3"
summary = "The Go compiler and standard library"
license = "BSD-3-Clause"
homepage = "https://go.dev/"
kind = "host"

[[source]]
url = "https://go.dev/dl/go1.27.3.linux-amd64.tar.gz"
sha256 = "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40"

[build]
script = '''
mkdir -p "$DESTDIR/opt/klos"
cp -a "$S" "$DESTDIR/opt/klos/go"
'''
