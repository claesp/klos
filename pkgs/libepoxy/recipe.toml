# libepoxy: the OpenGL function pointer library of GTK 3 (EGL only, no GLX).
[package]
name = "libepoxy"
version = "1.5.10"
summary = "OpenGL function pointer management library"
license = "MIT"
homepage = "https://github.com/anholt/libepoxy"
build-depends = ["mesa", "libdrm", "wayland"]
# Upstream does not sign releases (the tag is annotated, but not signed).
# The SHA-256 is pinned.

[[source]]
url = "https://github.com/anholt/libepoxy/archive/refs/tags/1.5.10.tar.gz"
filename = "libepoxy-1.5.10.tar.gz"
sha256 = "a7ced37f4102b745ac86d6a70a9da399cc139ff168ba6b8002b4d8d43c900c15"

[build]
script = '''
kmeson -Degl=yes -Dglx=no -Dx11=false -Dtests=false -Ddocs=false
kninja
kninja_install
'''
