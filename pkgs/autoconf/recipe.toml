# GNU Autoconf. A build tool of the KLOS builder (manifests/builder.toml).
# The images do not contain it.
[package]
name = "autoconf"
version = "2.73"
summary = "GNU Autoconf"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/autoconf/"

[[source]]
url = "https://ftpmirror.gnu.org/gnu/autoconf/autoconf-2.73.tar.xz"
sha256 = "9fd672b1c8425fac2fa67fa0477b990987268b90ff36d5f016dae57be0d6b52e"
signature = "https://ftpmirror.gnu.org/gnu/autoconf/autoconf-2.73.tar.xz.sig"
key = ["gnu-zackw"]

[build]
script = '''
M4=/usr/bin/m4 PERL=/usr/bin/perl kconfigure
kmake
make DESTDIR="$DESTDIR" install
'''
