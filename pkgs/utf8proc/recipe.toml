[package]
name = "utf8proc"
version = "2.12.0"
summary = "Unicode processing library"
license = "MIT"
homepage = "https://juliastrings.github.io/utf8proc/"
# Upstream does not sign this release. The SHA-256 is pinned.

[[source]]
url = "https://github.com/JuliaStrings/utf8proc/releases/download/v2.12.0/utf8proc-2.12.0.tar.gz"
sha256 = "a393fbef160835fb315bc3e91ba8d86f7a73a7cec9e6198b6c60b848b498bfeb"

[build]
script = '''
kcmake -DBUILD_SHARED_LIBS=ON -DUTF8PROC_ENABLE_TESTING=OFF
kninja
kninja_install
'''
