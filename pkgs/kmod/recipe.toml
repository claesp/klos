# Kernel module tools (modprobe, depmod, lsmod) for the desktop flavor.
# The server and kubernetes kernels have no modules and do not need kmod.
[package]
name = "kmod"
version = "34.2"
summary = "Linux kernel module tools"
license = "LGPL-2.1-or-later AND GPL-2.0-or-later"
homepage = "https://github.com/kmod-project/kmod"

[[source]]
url = "https://cdn.kernel.org/pub/linux/utils/kernel/kmod/kmod-34.2.tar.xz"
sha256 = "5a5d5073070cc7e0c7a7a3c6ec2a0e1780850c8b47b3e3892226b93ffcb9cb54"
signature = "https://cdn.kernel.org/pub/linux/utils/kernel/kmod/kmod-34.2.tar.sign"
signed-content = "uncompressed"
key = ["kmod-ldm"]

[build]
script = '''
kmeson -Dzstd=disabled -Dxz=disabled -Dzlib=disabled -Dopenssl=disabled \
	-Dmanpages=false -Ddocs=false -Dtools=true -Dbashcompletiondir=no \
	-Dfishcompletiondir=no -Dzshcompletiondir=no \
	-Dmoduledir=/usr/lib/modules -Ddistconfdir=/usr/lib
kninja
kninja_install
'''
