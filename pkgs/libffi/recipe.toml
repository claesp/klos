[package]
name = "libffi"
version = "3.8.0"
summary = "Foreign function interface library"
license = "MIT"
homepage = "https://sourceware.org/libffi/"
# Upstream does not sign this release. The SHA-256 is pinned.

[[source]]
url = "https://github.com/libffi/libffi/releases/download/v3.8.0/libffi-3.8.0.tar.gz"
sha256 = "7da3e2d9a171eb0a038f592ecad3ff2bb2550f3496d87b3b29ad0cf4430c0db4"

[build]
script = '''
kconfigure --disable-static --disable-docs --disable-multi-os-directory
kmake
make DESTDIR="$DESTDIR" install
'''
