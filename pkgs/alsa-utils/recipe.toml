# ALSA programs: aplay, arecord, amixer (without alsamixer, which needs
# ncurses). The desktop test plays sound with aplay through PipeWire.
[package]
name = "alsa-utils"
version = "1.2.16"
summary = "ALSA programs (aplay, amixer)"
license = "GPL-2.0-or-later"
homepage = "https://www.alsa-project.org/"
build-depends = ["alsa-lib"]

[[source]]
url = "https://www.alsa-project.org/files/pub/utils/alsa-utils-1.2.16.tar.bz2"
sha256 = "092399d5e8749a1d5e188e393157521cec4b75693b60ebb79bbce728cff2232c"
signature = "https://www.alsa-project.org/files/pub/utils/alsa-utils-1.2.16.tar.bz2.sig"
key = ["alsa-release"]

[build]
script = '''
kconfigure --disable-alsamixer --disable-alsaconf --disable-alsaloop --disable-bat \
	--disable-xmlto --disable-rst2man --with-udev-rules-dir=/usr/lib/udev/rules.d \
	--with-systemdsystemunitdir=no --disable-nls
kmake
make DESTDIR="$DESTDIR" install
# alsactl init scripts and udev rules: KLOS has no udev. alsa-info is a
# shell script that downloads data.
rm -rf "$DESTDIR/usr/lib/udev" "$DESTDIR/usr/bin/alsa-info.sh" "$DESTDIR/usr/share/sounds"
'''
