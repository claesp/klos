[package]
name = "mtdev"
version = "1.1.7"
summary = "Multitouch protocol translation library"
license = "MIT"
homepage = "https://bitmath.org/code/mtdev/"
# Upstream does not sign this release. The SHA-256 is pinned.

[[source]]
url = "https://bitmath.org/code/mtdev/mtdev-1.1.7.tar.bz2"
sha256 = "a107adad2101fecac54ac7f9f0e0a0dd155d954193da55c2340c97f2ff1d814e"

[build]
script = '''
kconfigure --disable-static
kmake
make DESTDIR="$DESTDIR" install
rm -f "$DESTDIR/usr/bin/mtdev-test"
'''
