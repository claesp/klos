# The TPM emulation library (for swtpm). A test tool of the KLOS builder (manifests/builder.toml):
# "./klos test" uses it. The images do not contain it.
[package]
name = "libtpms"
version = "0.10.2"
summary = "TPM 2.0 emulation library"
license = "BSD-3-Clause"
homepage = "https://github.com/stefanberger/libtpms"
build-depends = ["openssl"]

# Upstream signs the Git tags, not the archive. The SHA-256 is pinned.
[[source]]
url = "https://github.com/stefanberger/libtpms/archive/refs/tags/v0.10.2.tar.gz"
sha256 = "edac03680f8a4a1c5c1d609a10e3f41e1a129e38ff5158f0c8deaedc719fb127"
filename = "libtpms-0.10.2.tar.gz"

[build]
script = '''
NOCONFIGURE=1 ./autogen.sh
kconfigure --with-openssl --with-tpm2 --disable-static
kmake
make DESTDIR="$DESTDIR" install
'''
