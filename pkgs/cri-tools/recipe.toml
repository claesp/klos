[package]
name = "cri-tools"
version = "1.37.0"
summary = "crictl: command line tool for CRI runtimes"
license = "Apache-2.0"
homepage = "https://github.com/kubernetes-sigs/cri-tools"
implicit-deps = false
host-depends = ["go"]
options = { no-strip = true }
# GitHub makes the source archive from the signed tag v1.37.0.

[[source]]
url = "https://github.com/kubernetes-sigs/cri-tools/archive/refs/tags/v1.37.0.tar.gz"
filename = "cri-tools-1.37.0.tar.gz"
sha256 = "ef81c240412a5b77b164ae6570857b7a0f347770031a697764ba5167389842d8"

[build]
script = '''
kgoenv
mkdir -p "$DESTDIR/usr/bin"
go build -ldflags "-s -w -buildid= -X sigs.k8s.io/cri-tools/pkg/version.Version=v$PKGVER" \
	-o "$DESTDIR/usr/bin/crictl" ./cmd/crictl
'''
