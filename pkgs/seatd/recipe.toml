[package]
name = "seatd"
version = "0.9.3"
summary = "Seat management daemon and library (libseat)"
license = "MIT"
homepage = "https://sr.ht/~kennylevinsen/seatd/"
# Upstream does not sign this release. The SHA-256 is pinned.

[[source]]
url = "https://git.sr.ht/~kennylevinsen/seatd/archive/0.9.3.tar.gz"
filename = "seatd-0.9.3.tar.gz"
sha256 = "302564d54d8e28191fadfd734f2675ecb0c9e0615a58011b89ef15dfa4dbaa96"

[build]
script = '''
kmeson -Dlibseat-logind=disabled -Dlibseat-seatd=enabled -Dlibseat-builtin=disabled -Dserver=enabled -Dexamples=disabled -Dman-pages=disabled
kninja
kninja_install
'''
