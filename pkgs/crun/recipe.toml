# The OCI container runtime. It is written in C (smaller and faster than
# runc, and it has no Rust or Go dependency). containerd uses it.
[package]
name = "crun"
version = "1.30.1"
summary = "OCI container runtime"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
homepage = "https://github.com/containers/crun"
build-depends = ["libseccomp", "libcap", "json-c"]

[[source]]
url = "https://github.com/containers/crun/releases/download/1.30.1/crun-1.30.1.tar.gz"
sha256 = "99d036d95113552b6df66c7c879432835504bf0e525fc0372745071df129527b"
signature = "https://github.com/containers/crun/releases/download/1.30.1/crun-1.30.1.tar.gz.asc"
key = ["crun-gscrivano"]

[build]
script = '''
kconfigure --disable-static --disable-systemd --disable-criu \
	--enable-embedded-blake3 --disable-libcrun
kmake
make DESTDIR="$DESTDIR" install
'''
