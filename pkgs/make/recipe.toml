# GNU make. A build tool of the KLOS builder (manifests/builder.toml).
# The images do not contain it.
[package]
name = "make"
version = "4.4.1"
summary = "GNU make"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/make/"

[[source]]
url = "https://ftpmirror.gnu.org/gnu/make/make-4.4.1.tar.gz"
sha256 = "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3"
signature = "https://ftpmirror.gnu.org/gnu/make/make-4.4.1.tar.gz.sig"
key = ["gnu-psmith"]

[build]
script = '''
kconfigure --disable-nls --without-guile
kmake
make DESTDIR="$DESTDIR" install
rm -rf "$DESTDIR/usr/include"
'''
