# GNU find and xargs. A build tool of the KLOS builder (manifests/builder.toml).
# The images do not contain it.
[package]
name = "findutils"
version = "4.11.0"
summary = "GNU find and xargs"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/findutils/"

[[source]]
url = "https://ftpmirror.gnu.org/gnu/findutils/findutils-4.11.0.tar.xz"
sha256 = "bfd19cb06cc71f3352d567e90284d8cdac02ac89774bbeadf0b533b0c11432fd"
signature = "https://ftpmirror.gnu.org/gnu/findutils/findutils-4.11.0.tar.xz.sig"
key = ["gnu-youngman"]

[build]
script = '''
kconfigure --disable-nls --localstatedir=/var/lib/locate
kmake
make DESTDIR="$DESTDIR" install
'''
