# GNU gzip. A build tool of the KLOS builder (manifests/builder.toml).
# The images do not contain it.
[package]
name = "gzip"
version = "1.15"
summary = "GNU gzip"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/gzip/"

[[source]]
url = "https://ftpmirror.gnu.org/gnu/gzip/gzip-1.15.tar.xz"
sha256 = "9aa0cc780dec156b8282844833b342ab7cb08c25d2cd9a1869cdd0df31deff48"
signature = "https://ftpmirror.gnu.org/gnu/gzip/gzip-1.15.tar.xz.sig"
key = ["gnu-meyering"]

[build]
script = '''
kconfigure
kmake
make DESTDIR="$DESTDIR" install
'''
