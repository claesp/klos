# FAT tools for the EFI system partition.
[package]
name = "dosfstools"
version = "4.2"
summary = "FAT file system tools"
license = "GPL-3.0-or-later"
homepage = "https://github.com/dosfstools/dosfstools"

[[source]]
url = "https://github.com/dosfstools/dosfstools/releases/download/v4.2/dosfstools-4.2.tar.gz"
sha256 = "64926eebf90092dca21b14259a5301b7b98e7b1943e8a201c7d726084809b527"
signature = "https://github.com/dosfstools/dosfstools/releases/download/v4.2/dosfstools-4.2.tar.gz.sig"
key = ["dosfstools"]

[build]
script = '''
kconfigure --enable-compat-symlinks=no
kmake
make DESTDIR="$DESTDIR" install
'''
