# The GLSL to SPIR-V compiler. Only builds use it: Mesa runs
# glslangValidator (with run-tools) to compile the shaders of its Vulkan
# drivers. It is not in the images.
[package]
name = "glslang"
version = "1.4.363.0"
summary = "GLSL and HLSL to SPIR-V compiler (build only)"
license = "BSD-3-Clause AND Apache-2.0 AND MIT"
homepage = "https://github.com/KhronosGroup/glslang"
# GitHub makes the archive from the tag vulkan-sdk-1.4.363.0. No signature.

[[source]]
url = "https://github.com/KhronosGroup/glslang/archive/refs/tags/vulkan-sdk-1.4.363.0.tar.gz"
filename = "glslang-1.4.363.0.tar.gz"
sha256 = "cda24ec765e6d2845d106b7caa593f34127195a88524cf87821ff0088fb6edec"

[build]
script = '''
kcmake -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=OFF -DGLSLANG_TESTS=OFF \
	-DBUILD_SHARED_LIBS=OFF -DENABLE_GLSLANG_BINARIES=ON -DGLSLANG_ENABLE_INSTALL=ON
kninja
kninja_install
'''
