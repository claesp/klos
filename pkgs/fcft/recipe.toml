[package]
name = "fcft"
version = "3.3.3"
summary = "Font loading and glyph rasterization library"
license = "MIT"
homepage = "https://codeberg.org/dnkl/fcft"
build-depends = ["tllist", "freetype", "fontconfig", "pixman", "utf8proc", "libpng", "expat", "zlib"]

[[source]]
url = "https://codeberg.org/dnkl/fcft/releases/download/3.3.3/fcft-3.3.3.tar.gz"
sha256 = "bb298772d625e7d917373d541456f34f1957a9e22b16f17f64158b2c3816563c"
signature = "https://codeberg.org/dnkl/fcft/releases/download/3.3.3/fcft-3.3.3.tar.gz.sig"
key = ["dnkl"]

[build]
script = '''
kmeson -Dgrapheme-shaping=disabled -Drun-shaping=disabled -Dsvg-backend=none -Dtest-text-shaping=false -Ddocs=disabled -Dexamples=false
kninja
kninja_install
'''
