# GNU awk. A build tool of the KLOS builder (manifests/builder.toml).
# The images do not contain it.
# Version 5.3.2: gawk 5.4.1 without MPFR has a fault. After a numeric
# comparison with an unset array element ("if (x[1] == 0)"), the element
# prints as "0" and not as an empty string. The libpng build script
# (options.awk) then turns off all options.
[package]
name = "gawk"
version = "5.3.2"
summary = "GNU awk"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/gawk/"

[[source]]
url = "https://ftpmirror.gnu.org/gnu/gawk/gawk-5.3.2.tar.xz"
sha256 = "f8c3486509de705192138b00ef2c00bbbdd0e84c30d5c07d23fc73a9dc4cc9cc"
signature = "https://ftpmirror.gnu.org/gnu/gawk/gawk-5.3.2.tar.xz.sig"
key = ["gnu-arnold"]

[build]
script = '''
kconfigure --disable-nls --disable-extensions --without-readline --disable-pma --disable-mpfr
kmake
make DESTDIR="$DESTDIR" install
rm -rf "$DESTDIR/usr/include" "$DESTDIR/etc/profile.d"
'''

[watch]
# gawk 5.4 without MPFR has a fault (read the comment at the top).
ignore = '^5\.4\.'
