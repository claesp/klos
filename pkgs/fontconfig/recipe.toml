[package]
name = "fontconfig"
version = "2.18.3"
summary = "Font configuration library"
license = "HPND AND MIT"
homepage = "https://www.freedesktop.org/wiki/Software/fontconfig/"
build-depends = ["freetype", "expat"]
# Upstream signs the Git tag. kbuild compares the tarball with the signed
# Git tree (signature-type git-tag, docs/sources-and-keys.md).

[[source]]
# The archive of the signed Git tag (the release tarball adds generated
# documentation that the signature does not cover).
url = "https://gitlab.freedesktop.org/fontconfig/fontconfig/-/archive/2.18.3/fontconfig-2.18.3.tar.gz"
sha256 = "9ae01e1d53acdef56010c5451cd34aa41d325b2faccd8606448d8fa01b2496b3"
signature-type = "git-tag"
git = "https://gitlab.freedesktop.org/fontconfig/fontconfig.git"
tag = "2.18.3"
key = ["fontconfig-tagoh"]
# The archive leaves out the files with export-ignore in .gitattributes.
missing-files = [".*", ".gitlab-ci/*", "subprojects/.gitignore"]

[build]
script = '''
kmeson -Ddoc=disabled -Dtests=disabled -Dnls=disabled -Dcache-build=disabled -Dtools=enabled
kninja
kninja_install
'''

[watch]
url = "https://gitlab.freedesktop.org/fontconfig/fontconfig.git"
