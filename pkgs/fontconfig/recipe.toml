# The fontconfig release page publishes the same SHA-256 value
# (fontconfig-2.18.3.tar.xz.sha256sum).
[package]
name = "fontconfig"
version = "2.18.3"
summary = "Font configuration library"
license = "HPND AND MIT"
homepage = "https://www.freedesktop.org/wiki/Software/fontconfig/"
build-depends = ["freetype", "expat"]
# Upstream does not sign this release. The SHA-256 is pinned.

[[source]]
url = "https://gitlab.freedesktop.org/api/v4/projects/890/packages/generic/fontconfig/2.18.3/fontconfig-2.18.3.tar.xz"
sha256 = "4f7b554a38cdf78c033f666c8871f3749e14a094f65a07f630c91ed0b43d35e3"

[build]
script = '''
kmeson -Ddoc=disabled -Dtests=disabled -Dnls=disabled -Dcache-build=disabled -Dtools=enabled
kninja
kninja_install
'''
