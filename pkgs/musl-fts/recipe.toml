# The fts functions (file tree walk) that glibc has and musl does not have.
# Only a static library: elfutils needs it at build time.
[package]
name = "musl-fts"
version = "1.2.7"
summary = "fts functions for musl (static library)"
license = "BSD-3-Clause"
homepage = "https://github.com/void-linux/musl-fts"
# GitHub makes the archive from the tag v1.2.7. No signature.

[[source]]
url = "https://github.com/void-linux/musl-fts/archive/refs/tags/v1.2.7.tar.gz"
filename = "musl-fts-1.2.7.tar.gz"
sha256 = "49ae567a96dbab22823d045ffebe0d6b14b9b799925e9ca9274d47d26ff482a6"

[build]
script = '''
sh ./bootstrap.sh
kconfigure --enable-static --disable-shared
kmake
make DESTDIR="$DESTDIR" install
'''
