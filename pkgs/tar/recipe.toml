# GNU tar. A build tool of the KLOS builder (manifests/builder.toml).
# The images do not contain it.
[package]
name = "tar"
version = "1.35"
summary = "GNU tar"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/tar/"

[[source]]
url = "https://ftpmirror.gnu.org/gnu/tar/tar-1.35.tar.xz"
sha256 = "4d62ff37342ec7aed748535323930c7cf94acf71c3591882b26a7ea50f3edc16"
signature = "https://ftpmirror.gnu.org/gnu/tar/tar-1.35.tar.xz.sig"
key = ["gnu-gray"]

[build]
script = '''
kconfigure --disable-nls --without-selinux --disable-acl
kmake
make DESTDIR="$DESTDIR" install
rm -rf "$DESTDIR/usr/lib/rmt" "$DESTDIR/usr/libexec"
'''
