[package]
name = "zstd"
version = "1.5.7"
summary = "Zstandard compression library"
license = "BSD-3-Clause"
homepage = "https://facebook.github.io/zstd/"
# Upstream does not sign this release. The SHA-256 is pinned.

[[source]]
url = "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"
sha256 = "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3"

[build]
script = '''
MESON_SOURCE=build/meson kmeson -Dbin_programs=false -Dbin_contrib=false -Dbin_tests=false -Dzlib=disabled -Dlzma=disabled -Dlz4=disabled
kninja
kninja_install
'''
