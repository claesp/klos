# ninja-compatible build tool. A build tool of the KLOS builder (manifests/builder.toml).
# The images do not contain it.
[package]
name = "samurai"
version = "1.3"
summary = "ninja-compatible build tool"
license = "Apache-2.0 AND MIT"
homepage = "https://github.com/michaelforney/samurai"

# Upstream does not sign this release. The SHA-256 is pinned.
[[source]]
url = "https://github.com/michaelforney/samurai/releases/download/1.3/samurai-1.3.tar.gz"
sha256 = "1bc020a9e133432df51911ac71cc34322f828934d9a2282ba2916d88c15976af"

[build]
script = '''
kmake CC=cc CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"
make DESTDIR="$DESTDIR" PREFIX=/usr install
ln -s samu "$DESTDIR/usr/bin/ninja"
'''
