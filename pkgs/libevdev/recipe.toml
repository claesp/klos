[package]
name = "libevdev"
version = "1.14.0"
summary = "Linux input event device library"
license = "MIT"
homepage = "https://www.freedesktop.org/wiki/Software/libevdev/"

# Upstream signs with a DSA-1024 key (from 2003). kbuild does not accept
# keys that weak, so the SHA-256 is pinned.
[[source]]
url = "https://www.freedesktop.org/software/libevdev/libevdev-1.14.0.tar.xz"
sha256 = "5a0966c7110648665983848bad696c7acba614a2160d2865d535397101007332"

[build]
script = '''
kmeson -Dtests=disabled -Ddocumentation=disabled
kninja
kninja_install
'''
