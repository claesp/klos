[package]
name = "swaybg"
version = "1.2.2"
summary = "Wallpaper tool for Wayland"
license = "MIT"
homepage = "https://github.com/swaywm/swaybg"
build-depends = ["wayland", "wayland-protocols", "cairo", "pixman", "freetype", "fontconfig", "libpng", "glib", "expat", "libffi", "zlib"]

[package.options]
run-tools = ["wayland-scanner"]

[[source]]
url = "https://github.com/swaywm/swaybg/releases/download/v1.2.2/swaybg-1.2.2.tar.gz"
sha256 = "a6652a0060a0bea3c3318d9d03b6dddac34f6aeca01b883eef9e58281f5202a1"
signature = "https://github.com/swaywm/swaybg/releases/download/v1.2.2/swaybg-1.2.2.tar.gz.sig"
key = ["freedesktop-emersion"]

[build]
script = '''
kmeson -Dwerror=false -Dgdk-pixbuf=disabled -Dman-pages=disabled
kninja
kninja_install
'''
