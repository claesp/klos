# GNU perfect hash function generator. A build tool of the KLOS builder (manifests/builder.toml).
# The images do not contain it.
[package]
name = "gperf"
version = "3.3"
summary = "GNU perfect hash function generator"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/gperf/"

[[source]]
url = "https://ftpmirror.gnu.org/gnu/gperf/gperf-3.3.tar.gz"
sha256 = "fd87e0aba7e43ae054837afd6cd4db03a3f2693deb3619085e6ed9d8d9604ad8"
signature = "https://ftpmirror.gnu.org/gnu/gperf/gperf-3.3.tar.gz.sig"
key = ["gnu-haible"]

[build]
script = '''
kconfigure
kmake
make DESTDIR="$DESTDIR" install
'''
