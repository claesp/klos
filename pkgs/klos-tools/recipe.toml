# The KLOS system tool (src/klos): the initramfs init, updates, the
# installer and early boot set-up. Static Go binary, standard library only.
[package]
name = "klos-tools"
version = "0.1.0"
summary = "KLOS init, update and installer tool"
license = "BSD-2-Clause"
implicit-deps = false
host-depends = ["go"]
local-source = "src/klos"
options = { no-strip = true }

[build]
script = '''
export PATH="$HOST_GO/opt/klos/go/bin:$PATH" CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v2
export GOFLAGS="-trimpath -buildvcs=false"
go vet .
go build -ldflags="-s -w -buildid=" -o "$DESTDIR/usr/bin/klos" .
'''
