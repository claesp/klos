# GNU bc calculator. A build tool of the KLOS builder (manifests/builder.toml).
# The images do not contain it.
[package]
name = "bc"
version = "1.08.2"
summary = "GNU bc calculator"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/bc/"

[[source]]
url = "https://ftpmirror.gnu.org/gnu/bc/bc-1.08.2.tar.gz"
sha256 = "ae470fec429775653e042015edc928d07c8c3b2fc59765172a330d3d87785f86"
signature = "https://ftpmirror.gnu.org/gnu/bc/bc-1.08.2.tar.gz.sig"
key = ["gnu-pizzini"]

[build]
script = '''
kconfigure
kmake
make DESTDIR="$DESTDIR" install
'''
