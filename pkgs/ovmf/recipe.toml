# OVMF, the UEFI firmware of QEMU (EDK II), with Secure Boot and TPM 2.0. A
# host tool: "./klos test" starts the test virtual machines with it. The
# images do not contain it.
#
# EDK II publishes the Git tag only. The sources are the archives of the
# tag and of the Git submodules (the commits of the tag). Upstream does
# not sign them. The SHA-256 values are pinned.
[package]
name = "ovmf"
version = "202608"
summary = "UEFI firmware for QEMU (OVMF)"
license = "BSD-2-Clause-Patent"
homepage = "https://github.com/tianocore/edk2"
kind = "host"
host-depends = ["nasm", "acpica"]

[[source]]
url = "https://github.com/tianocore/edk2/archive/refs/tags/edk2-stable202608.tar.gz"
sha256 = "bac40812213576c3025cf780c33d882f9e087a44201b1cd28a07f6d1eb54b76a"
filename = "edk2-stable202608.tar.gz"

