[build]
script = '''
cp -a ../sub/openssl-8cf17aaeb4599f8af87fefd810b5b5fee90fe69e/. CryptoPkg/Library/OpensslLib/openssl/
cp -a ../sub/brotli-e230f474b87134e8c6c85b630084c612057f253e/. MdeModulePkg/Library/BrotliCustomDecompressLib/brotli/
cp -a ../sub/oniguruma-4ef89209a239c1aea328cf13c05a2807e5c146d1/. MdeModulePkg/Universal/RegularExpressionDxe/oniguruma/
cp -a ../sub/public-mipi-sys-t-370b5944c046bab043dd8b133727b2135af7747a/. MdePkg/Library/MipiSysTLib/mipisyst/
cp -a ../sub/pylibfdt-cfff805481bdea27f900c32698171286542b8d3c/. MdePkg/Library/BaseFdtLib/libfdt/
cp -a ../sub/libspdm-f55cf6d48ec69b4ac60a63903e9c6a2cb0fd155d/. SecurityPkg/DeviceSecurity/SpdmLib/libspdm/
cp -a ../sub/mbedtls-0bebf8b8c7f07abe3571ded48a11aa907a1ffb20/. CryptoPkg/Library/MbedTlsLib/mbedtls/
cp -a ../sub/TPM-bc29a21d44b01396223c152a4834e52318591770/. TcgTpmPkg/Library/TpmLib/TPM/
cp -a ../sub/brotli-e230f474b87134e8c6c85b630084c612057f253e/. BaseTools/Source/C/BrotliCompress/brotli/
export PATH="$HOST_NASM/$TOOLCHAIN_PREFIX/bin:$HOST_ACPICA/$TOOLCHAIN_PREFIX/bin:$PATH"
# Newer Clang versions have more warnings, and BaseTools uses -Werror.
make -C BaseTools -j"$JOBS" CC="$CC" CXX="$CXX" CLANG=1 EXTRA_OPTFLAGS=-Wno-error
export WORKSPACE="$S" PYTHON_COMMAND=python3
# edksetup.sh uses variables that are not set (bash -u stops it).
set +u
. ./edksetup.sh
set -u
# This Clang has warnings that EDK II does not know, and EDK II uses
# -Werror. CLANG_BIN is the path prefix of the CLANGDWARF tools: a wrapper
# adds -Wno-error. OVMF is a test tool only.
W="$S/clang-bin"
mkdir -p "$W"
for t in /usr/bin/llvm-* /usr/bin/ld.lld /usr/bin/lld /usr/bin/clang++; do
	[ -e "$t" ] && ln -sf "$t" "$W/"
done
printf '#!/bin/sh\nexec /usr/bin/clang "$@" -Wno-error\n' > "$W/clang"
chmod +x "$W/clang"
export CLANG_BIN="$W/"
build -a X64 -t CLANGDWARF -b RELEASE -n "$JOBS" -p OvmfPkg/OvmfPkgX64.dsc \
	-D SECURE_BOOT_ENABLE=TRUE -D TPM2_ENABLE=TRUE -D SMM_REQUIRE=FALSE \
	-D NETWORK_ENABLE=FALSE
FV=Build/OvmfX64/RELEASE_CLANGDWARF/FV
for f in OVMF_CODE.fd OVMF_VARS.fd; do
	install -D -m 0644 "$FV/$f" "$DESTDIR$PREFIX/share/ovmf/$f"
done
'''
