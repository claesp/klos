# ASN.1 library (for swtpm). A test tool of the KLOS builder
# (manifests/builder.toml). The images do not contain it.
[package]
name = "libtasn1"
version = "4.21.0"
summary = "ASN.1 library"
license = "LGPL-2.1-or-later"
homepage = "https://www.gnu.org/software/libtasn1/"

[[source]]
url = "https://ftpmirror.gnu.org/gnu/libtasn1/libtasn1-4.21.0.tar.gz"
sha256 = "1d8a444a223cc5464240777346e125de51d8e6abf0b8bac742ac84609167dc87"
signature = "https://ftpmirror.gnu.org/gnu/libtasn1/libtasn1-4.21.0.tar.gz.sig"
key = ["gnu-josefsson"]

[build]
script = '''
kconfigure --disable-static --disable-doc
kmake
make DESTDIR="$DESTDIR" install
'''
