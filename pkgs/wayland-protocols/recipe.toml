[package]
name = "wayland-protocols"
version = "1.49"
summary = "Wayland protocol extensions"
license = "MIT"
homepage = "https://gitlab.freedesktop.org/wayland/wayland-protocols"
build-depends = ["wayland"]

[package.options]
run-tools = ["wayland-scanner"]

[[source]]
url = "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.49/downloads/wayland-protocols-1.49.tar.xz"
sha256 = "ec4c8f74942d6dff7ace8b4ce4764f0ef9ff618a935d974ea77edee2ad240b14"
signature = "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.49/downloads/wayland-protocols-1.49.tar.xz.sig"
key = ["freedesktop-emersion"]

[build]
script = '''
kmeson -Dtests=false
kninja
kninja_install
'''
