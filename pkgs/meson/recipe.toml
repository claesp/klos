# The Meson build system. A build tool of the KLOS builder
# (manifests/builder.toml). The images do not contain it.
[package]
name = "meson"
version = "1.12.1"
summary = "Meson build system"
license = "Apache-2.0"
homepage = "https://mesonbuild.com/"
implicit-deps = false

[[source]]
url = "https://github.com/mesonbuild/meson/releases/download/1.12.1/meson-1.12.1.tar.gz"
sha256 = "ab0a6ca09f8ef70c564c8241fb5a23957886a0b53fb58412b5e07eaf07dba743"
signature = "https://github.com/mesonbuild/meson/releases/download/1.12.1/meson-1.12.1.tar.gz.asc"
key = ["meson-jpakkane"]

[build]
script = '''
# One file (a Python zip application) that runs with /usr/bin/python3.
mkdir -p "$DESTDIR/usr/bin"
python3 packaging/create_zipapp.py --outfile "$DESTDIR/usr/bin/meson" \
	--interpreter /usr/bin/python3 --compress .
'''
