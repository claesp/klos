# JSON library (for swtpm). A test tool of the KLOS builder (manifests/builder.toml):
# "./klos test" uses it. The images do not contain it.
[package]
name = "json-glib"
version = "1.10.8"
summary = "JSON library based on GLib"
license = "LGPL-2.1-or-later"
homepage = "https://gitlab.gnome.org/GNOME/json-glib"
build-depends = ["glib"]

[package.options]
run-tools = ["glib-mkenums"]

# Upstream signs the Git tag. kbuild compares the tarball with the signed
# Git tree (signature-type git-tag, docs/sources-and-keys.md).
[[source]]
# The archive of the signed Git tag (the release tarball adds generated
# documentation that the signature does not cover).
url = "https://gitlab.gnome.org/GNOME/json-glib/-/archive/1.10.8/json-glib-1.10.8.tar.gz"
sha256 = "7a114bdac0b2611a7207e981c37fa9b1e70d9cb642470cd9e967b135428cec52"
signature-type = "git-tag"
git = "https://gitlab.gnome.org/GNOME/json-glib.git"
tag = "1.10.8"
key = ["cairo-ebassi"]
# The archive leaves out the files with export-ignore in .gitattributes.
missing-files = [".gitattributes", ".gitignore", "json-glib.doap"]

[build]
script = '''
kmeson -Dintrospection=disabled -Dgtk_doc=disabled -Dtests=false -Dman=false -Dnls=disabled -Dconformance=false
kninja
kninja_install
'''

[watch]
# An odd minor version is a development release.
ignore = '^[0-9]+\.[0-9]*[13579]\.'
