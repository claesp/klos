# JSON library (for swtpm). A test tool of the KLOS builder (manifests/builder.toml):
# "./klos test" uses it. The images do not contain it.
[package]
name = "json-glib"
version = "1.10.8"
summary = "JSON library based on GLib"
license = "LGPL-2.1-or-later"
homepage = "https://gitlab.gnome.org/GNOME/json-glib"
build-depends = ["glib"]

[package.options]
run-tools = ["glib-mkenums"]

# Upstream does not sign releases. The pinned SHA-256 agrees with the value
# that download.gnome.org publishes.
[[source]]
url = "https://download.gnome.org/sources/json-glib/1.10/json-glib-1.10.8.tar.xz"
sha256 = "55c5c141a564245b8f8fbe7698663c87a45a7333c2a2c56f06f811ab73b212dd"

[build]
script = '''
kmeson -Dintrospection=disabled -Dgtk_doc=disabled -Dtests=false -Dman=false -Dnls=disabled -Dconformance=false
kninja
kninja_install
'''
