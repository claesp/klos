# The Netwide Assembler, a host tool: the OVMF build needs it.
[package]
name = "nasm"
version = "3.02"
summary = "x86 assembler"
license = "BSD-2-Clause"
homepage = "https://www.nasm.us/"
kind = "host"

# Upstream does not sign releases. The SHA-256 is pinned.
[[source]]
url = "https://www.nasm.us/pub/nasm/releasebuilds/3.02/nasm-3.02.tar.xz"
sha256 = "87336eba53b4acfe917424ab5d500d2b0054d9f5148d35c2273ccf2cfb712f0d"

[build]
script = '''
./configure --prefix="$PREFIX"
make -j"$JOBS"
make DESTDIR="$DESTDIR" install
'''
