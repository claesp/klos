# NTP client and server. libcap lets chronyd run as the user "chrony".
# The chrony seccomp filter (-F) does not allow all system calls of musl,
# so KLOS does not use it (see docs/status.md).
[package]
name = "chrony"
version = "4.9"
summary = "NTP client and server"
license = "GPL-2.0-only"
homepage = "https://chrony-project.org/"
build-depends = ["libcap"]

[[source]]
url = "https://chrony-project.org/releases/chrony-4.9.tar.gz"
sha256 = "4924c6f530105bcd5b9e9e33c48a2ae1bfd889222c8480bc41601110efc864d0"
signature = "https://chrony-project.org/releases/chrony-4.9-tar-gz-asc.txt"
key = ["chrony-mlichvar"]

[build]
script = '''
./configure --prefix=/usr --sbindir=/usr/bin --sysconfdir=/etc/chrony \
	--chronyrundir=/run/chrony --chronyvardir=/var/lib/chrony \
	--host-system=Linux --host-machine=x86_64 \
	--without-nettle --without-gnutls --without-nss --without-tomcrypt \
	--without-editline --disable-readline \
	--with-user=chrony --disable-sechash
kmake
make DESTDIR="$DESTDIR" install
'''
