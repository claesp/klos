# LLVM and the clang libraries for the target (libLLVM.so, libclang-cpp.so).
# Mesa uses LLVM for llvmpipe and the AMD radeonsi driver, and the clang
# libraries for mesa_clc (the OpenCL C compiler of the Intel drivers, which
# runs only at build time). This is not the cross toolchain (package llvm).
#
# Pass 1 builds the TableGen tools as static programs, which run in the
# builder. Pass 2 is the cross build; it uses the pass 1 tools.
[package]
name = "llvm-target"
version = "23.1.4"
summary = "LLVM and clang libraries for the target"
license = "Apache-2.0 WITH LLVM-exception"
homepage = "https://llvm.org/"
build-depends = ["zlib", "zstd"]

[[source]]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/llvm-project-23.1.4.src.tar.xz"
sha256 = "819ecf7351f1a66f76b2d701d8942faaf5faeb324cb90c9d5b090de142434bb2"
signature = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/llvm-project-23.1.4.src.tar.xz.sig"
key = ["llvm"]

[build]
script = '''
BIN=$(dirname "$(command -v cc)")
common="-DLLVM_ENABLE_PROJECTS=clang -DLLVM_TARGETS_TO_BUILD=X86;AMDGPU \
	-DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF \
	-DLLVM_INCLUDE_DOCS=OFF -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_ENABLE_LIBEDIT=OFF \
	-DLLVM_ENABLE_FFI=OFF -DCLANG_ENABLE_STATIC_ANALYZER=OFF"
# Pass 1: static TableGen tools for the builder.
# Not a cross build: CMake must not use the kbuild toolchain file here.
env -u CMAKE_TOOLCHAIN_FILE cmake -S llvm -B build-tblgen -G Ninja -DCMAKE_BUILD_TYPE=Release \
	-DCMAKE_C_COMPILER="$BIN/cc" -DCMAKE_CXX_COMPILER="$BIN/c++" \
	-DCMAKE_EXE_LINKER_FLAGS=-static -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF \
	$common
# All the tools that a cross build of LLVM runs (see LLVM_NATIVE_TOOL_DIR).
ninja -C build-tblgen -j"$JOBS" llvm-tblgen llvm-min-tblgen clang-tblgen \
	llvm-config llvm-nm llvm-readobj
# Pass 2: the cross build.
CMAKE_SOURCE=llvm kcmake -DCMAKE_BUILD_TYPE=Release \
	-DLLVM_NATIVE_TOOL_DIR="$S/build-tblgen/bin" \
	-DLLVM_HOST_TRIPLE="$TARGET" -DLLVM_DEFAULT_TARGET_TRIPLE="$TARGET" \
	-DLLVM_BUILD_LLVM_DYLIB=ON -DLLVM_LINK_LLVM_DYLIB=ON -DCLANG_LINK_CLANG_DYLIB=ON \
	-DLLVM_ENABLE_RTTI=ON -DLLVM_ENABLE_ZLIB=ON -DLLVM_ENABLE_ZSTD=ON \
	-DLLVM_INSTALL_UTILS=OFF -DLLVM_BUILD_UTILS=OFF \
	-DLLVM_PARALLEL_LINK_JOBS=4 $common
kninja
kninja_install
# The tools stay in the package, because the CMake export files of LLVM
# refer to them. The desktop manifest keeps them out of the image.
rm -rf "$DESTDIR/usr/share/clang" "$DESTDIR/usr/share/opt-viewer" "$DESTDIR/usr/share/scan-build" \
	"$DESTDIR/usr/share/scan-view" "$DESTDIR/usr/libexec"
'''
