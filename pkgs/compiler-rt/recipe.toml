# The KLOS cross toolchain, part 2: the compiler-rt builtins and the CRT
# start files (crtbegin.o, crtend.o) for the target. They replace libgcc.
# The new Clang (package llvm) compiles them.
[package]
name = "compiler-rt"
version = "23.1.4"
summary = "compiler-rt builtins and CRT files for the target"
license = "Apache-2.0 WITH LLVM-exception"
homepage = "https://compiler-rt.llvm.org/"
kind = "host"
host-depends = ["llvm"]

[[source]]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/llvm-project-23.1.4.src.tar.xz"
sha256 = "819ecf7351f1a66f76b2d701d8942faaf5faeb324cb90c9d5b090de142434bb2"
signature = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/llvm-project-23.1.4.src.tar.xz.sig"
key = ["llvm"]

# The musl headers are necessary to compile the builtins.
[[source]]
url = "https://musl.libc.org/releases/musl-1.2.6.tar.gz"
sha256 = "d585fd3b613c66151fc3249e8ed44f77020cb5e6c1e635a616d3f9f82460512a"
signature = "https://musl.libc.org/releases/musl-1.2.6.tar.gz.asc"
key = ["musl"]
dest = "musl"

[build]
script = '''
TC="$HOST_LLVM$PREFIX"
MAJOR=$("$TC/bin/clang" -dumpversion | cut -d. -f1)
RES="$PREFIX/lib/clang/$MAJOR"
make -C "$S/../musl/musl-1.2.6" ARCH=x86_64 prefix=/usr DESTDIR="$S/hdr" install-headers
cmake -S runtimes -B build-rt -G Ninja \
	-DLLVM_ENABLE_RUNTIMES=compiler-rt \
	-DLLVM_INCLUDE_TESTS=OFF \
	-DCOMPILER_RT_INCLUDE_TESTS=OFF \
	-DCMAKE_BUILD_TYPE=Release \
	-DCMAKE_INSTALL_PREFIX="$RES" \
	-DCMAKE_C_COMPILER="$TC/bin/clang" \
	-DCMAKE_CXX_COMPILER="$TC/bin/clang++" \
	-DCMAKE_ASM_COMPILER="$TC/bin/clang" \
	-DCMAKE_AR="$TC/bin/llvm-ar" -DCMAKE_NM="$TC/bin/llvm-nm" \
	-DCMAKE_RANLIB="$TC/bin/llvm-ranlib" \
	-DCMAKE_C_COMPILER_TARGET="$TARGET" \
	-DCMAKE_C_FLAGS="-ffile-prefix-map=$S=/usr/src/compiler-rt" \
	-DCMAKE_ASM_FLAGS="-ffile-prefix-map=$S=/usr/src/compiler-rt" \
	-DCMAKE_CXX_COMPILER_TARGET="$TARGET" \
	-DCMAKE_ASM_COMPILER_TARGET="$TARGET" \
	-DCMAKE_SYSROOT="$S/hdr" \
	-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
	-DLLVM_ENABLE_PER_TARGET_RUNTIME_DIR=ON \
	-DCOMPILER_RT_DEFAULT_TARGET_ONLY=ON \
	-DCOMPILER_RT_BUILD_BUILTINS=ON \
	-DCOMPILER_RT_BUILD_CRT=ON \
	-DCOMPILER_RT_BUILD_SANITIZERS=OFF \
	-DCOMPILER_RT_BUILD_XRAY=OFF \
	-DCOMPILER_RT_BUILD_LIBFUZZER=OFF \
	-DCOMPILER_RT_BUILD_PROFILE=OFF \
	-DCOMPILER_RT_BUILD_MEMPROF=OFF \
	-DCOMPILER_RT_BUILD_ORC=OFF \
	-DCOMPILER_RT_BUILD_CTX_PROFILE=OFF \
	-DCOMPILER_RT_BUILD_GWP_ASAN=OFF \
	-DCOMPILER_RT_USE_BUILTINS_LIBRARY=ON
ninja -C build-rt -j"$JOBS"
DESTDIR="$DESTDIR" ninja -C build-rt install
test -f "$DESTDIR$RES/lib/$TARGET/libclang_rt.builtins.a"
test -f "$DESTDIR$RES/lib/$TARGET/clang_rt.crtbegin.o"
'''
