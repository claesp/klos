# Pure Python modules that build scripts import. They run only in the
# builder. PyPI publishes the SHA-256 values.
[package]
name = "python-build-modules"
version = "1"
summary = "Python modules for build scripts (Mesa): mako, markupsafe, pyyaml, packaging"
license = "MIT AND BSD-3-Clause AND Apache-2.0"
homepage = "https://pypi.org/"
kind = "host"
# Upstream does not sign this release. The SHA-256 is pinned.

[[source]]
url = "https://files.pythonhosted.org/packages/5a/09/e07c4b5579a79f4b16f8d4f29f6c54514ac787c4ad506b8c4f28a0e6b0bf/mako-1.4.3.tar.gz"
sha256 = "cd6537fe88d5fec315c55c2f8529bc4ce7a9a352ad7db3eeaa6a66e2dd4ec37a"

[[source]]
url = "https://files.pythonhosted.org/packages/38/9b/e422a865e1d5d57d0e509b4e0bf1c1a70a7f6382c29a5aa428df994c8bc8/markupsafe-3.0.4.tar.gz"
sha256 = "2e9ad7dd851bf45fab9f75cbff4cb493fee9979e8d8c7c9c3ee119022518edd6"
signature = "https://pypi.org/integrity/markupsafe/3.0.4/markupsafe-3.0.4.tar.gz/provenance"
signature-type = "pypi-attestation"
identity = "https://github.com/pallets/markupsafe/.github/workflows/publish.yaml@refs/tags/3.0.4"
issuer = "https://token.actions.githubusercontent.com"

[[source]]
url = "https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz"
sha256 = "d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f"

[[source]]
url = "https://files.pythonhosted.org/packages/7d/fa/3944b40b07da9ce895c0e6303a5ab7d53da063554f534556b134a54d6093/packaging-26.3.tar.gz"
sha256 = "94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79"
signature = "https://pypi.org/integrity/packaging/26.3/packaging-26.3.tar.gz/provenance"
signature-type = "pypi-attestation"
identity = "https://github.com/pypa/packaging/.github/workflows/publish.yml@refs/heads/main"
issuer = "https://token.actions.githubusercontent.com"

[build]
script = '''
P="$DESTDIR$PREFIX/python"
mkdir -p "$P"
cp -a mako "$P/"
cp -a ../markupsafe-3.0.4/src/markupsafe "$P/"
cp -a ../pyyaml-6.0.3/lib/yaml "$P/"
cp -a ../packaging-26.3/src/packaging "$P/"
'''

[watch]
disabled = "Python modules for builds (OSV.dev checks them)"
