# XZ Utils (LZMA compression). A build tool of the KLOS builder (manifests/builder.toml).
# The images do not contain it.
[package]
name = "xz"
version = "5.8.4"
summary = "XZ Utils (LZMA compression)"
license = "0BSD AND GPL-2.0-or-later"
homepage = "https://tukaani.org/xz/"

[[source]]
url = "https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.xz"
sha256 = "4ce24038fd4221e0d13bc1a2de7a4db56e90b92b3bf75321f6c14be73f65de4b"
signature = "https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.xz.sig"
key = ["xz-lasse"]

[build]
script = '''
kconfigure --disable-nls --disable-static --disable-doc --disable-scripts
kmake
make DESTDIR="$DESTDIR" install
'''
