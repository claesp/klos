# Mesa: OpenGL, OpenGL ES and EGL. The drivers:
#   radeonsi  AMD graphics (needs LLVM with AMDGPU, and libelf)
#   iris      Intel graphics, gen 8 and later (needs mesa_clc)
#   crocus    older Intel graphics, gen 4 to 7 (needs mesa_clc)
#   nouveau   NVIDIA graphics (the open driver)
#   virgl     the virtio GPU of virtual machines
#   llvmpipe  the fast software renderer (needs LLVM)
#   softpipe  the reference software renderer
# The Vulkan drivers:
#   radv      AMD graphics
#   anv       Intel graphics, gen 9 and later ("intel")
#   lavapipe  software Vulkan (needs LLVM) ("swrast")
#   venus     Vulkan through the virtio GPU ("virtio")
# NVK (NVIDIA) needs Rust, which KLOS does not have yet.
# glslangValidator compiles the Vulkan meta shaders at build time.
# mesa_clc (the OpenCL C compiler for the Intel drivers) is a target
# program; Meson runs it in the builder through the exe_wrapper of the
# kbuild cross file. It is not installed.
[package]
name = "mesa"
version = "26.2.5"
summary = "OpenGL and EGL graphics drivers"
license = "MIT"
homepage = "https://mesa3d.org/"
build-depends = ["libdrm", "wayland", "wayland-protocols", "expat", "zlib", "zstd",
  "llvm-target", "elfutils", "spirv-tools", "spirv-headers", "spirv-llvm-translator", "glslang"]
host-depends = ["python-build-modules"]

[package.options]
run-tools = ["wayland-scanner", "llvm-config", "glslangValidator"]

[[source]]
url = "https://archive.mesa3d.org/mesa-26.2.5.tar.xz"
sha256 = "794b3d1729075dae7ebd47c7283b7ca0cdb5dec668f7f11cc0a5d82f6138a0a5"
signature = "https://archive.mesa3d.org/mesa-26.2.5.tar.xz.sig"
key = ["mesa-release"]

[build]
script = '''
export PYTHONPATH="$HOST_PYTHON_BUILD_MODULES/opt/klos/toolchain/python"
kmeson -Dplatforms=wayland -Dvulkan-drivers=amd,intel,swrast,virtio \
	-Dintel-rt=disabled -Dvulkan-layers= \
	-Dgallium-drivers=radeonsi,iris,crocus,nouveau,virgl,llvmpipe,softpipe \
	-Dllvm=enabled -Dshared-llvm=enabled -Damd-use-llvm=true -Dglx=disabled -Degl=enabled -Dgbm=enabled -Dgles1=disabled \
	-Dgles2=enabled -Dopengl=true -Dvalgrind=disabled -Dlibunwind=disabled \
	-Dzstd=enabled -Dexpat=enabled -Dbuild-tests=false -Dvideo-codecs= \
	-Dgallium-va=disabled -Dgallium-rusticl=false \
	-Dmicrosoft-clc=disabled -Dmesa-clc=auto -Dspirv-tools=enabled -Dlmsensors=disabled \
	-Dselinux=false -Dxmlconfig=disabled -Dgallium-extra-hud=false
kninja
kninja_install
'''
