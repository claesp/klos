# GNU parser generator. A build tool of the KLOS builder (manifests/builder.toml).
# The images do not contain it.
[package]
name = "bison"
version = "3.8.2"
summary = "GNU parser generator"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/bison/"

[[source]]
url = "https://ftpmirror.gnu.org/gnu/bison/bison-3.8.2.tar.xz"
sha256 = "9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2"
signature = "https://ftpmirror.gnu.org/gnu/bison/bison-3.8.2.tar.xz.sig"
key = ["gnu-demaille"]

[build]
script = '''
M4=/usr/bin/m4 kconfigure --disable-nls
kmake
make DESTDIR="$DESTDIR" install
'''
