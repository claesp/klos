# The base directory layout. Read docs/filesystem.md.
[package]
name = "filesystem"
version = "1"
summary = "Base directories and the merged /usr symlinks"
license = "BSD-2-Clause"
implicit-deps = false
options = { keep-empty-dirs = true }

[build]
script = '''
cd "$DESTDIR"
mkdir -p usr/bin usr/lib usr/share usr/include etc dev proc sys run tmp var mnt opt efi
ln -s usr/bin bin
ln -s usr/bin sbin
ln -s usr/lib lib
ln -s usr/lib lib64
ln -s bin usr/sbin
ln -s lib usr/lib64
# Writable paths are on the /var volume (the OS volume is read-only).
ln -s var/home home
ln -s var/roothome root
ln -s var/srv srv
ln -s ../var/usrlocal usr/local
ln -s run/media media
chmod 1777 tmp
'''
