# GNU patch. A build tool of the KLOS builder (manifests/builder.toml).
# The images do not contain it.
[package]
name = "patch"
version = "2.8.1"
summary = "GNU patch"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/patch/"

[[source]]
url = "https://ftpmirror.gnu.org/gnu/patch/patch-2.8.1.tar.xz"
sha256 = "3240c7959c5347c8ed347e3c4201c0337bf4240d5cf09d68889e58eeaba30e17"
signature = "https://ftpmirror.gnu.org/gnu/patch/patch-2.8.1.tar.xz.sig"
key = ["gnu-agruen"]

[build]
script = '''
kconfigure --disable-nls --disable-xattr
kmake
make DESTDIR="$DESTDIR" install
'''
