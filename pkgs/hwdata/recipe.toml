[package]
name = "hwdata"
version = "0.412"
summary = "Hardware identification data (build only)"
license = "GPL-2.0-or-later"
homepage = "https://github.com/vcrhonek/hwdata"
implicit-deps = false
# Upstream does not sign this release. The SHA-256 is pinned.

[[source]]
url = "https://github.com/vcrhonek/hwdata/archive/refs/tags/v0.412.tar.gz"
filename = "hwdata-0.412.tar.gz"
sha256 = "f0c64cd7e31d70a5fb3a52e53ab50a61e74c0421a6381eaa45114eec3bde5fe7"

[build]
script = '''
./configure --prefix=/usr --datadir=/usr/share --disable-blacklist
make DESTDIR="$DESTDIR" install
rm -rf "$DESTDIR/usr/lib/modprobe.d"
'''
