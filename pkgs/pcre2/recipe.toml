[package]
name = "pcre2"
version = "10.49"
summary = "Perl-compatible regular expression library"
license = "BSD-3-Clause"
homepage = "https://pcre2project.github.io/pcre2/"

[[source]]
url = "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.49/pcre2-10.49.tar.bz2"
sha256 = "53c156e1ba416a20da8e65395daa132da0d80e76910424caca3fcdae7831d384"
signature = "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.49/pcre2-10.49.tar.bz2.sig"
key = ["pcre2"]

[build]
script = '''
kconfigure --disable-static --enable-jit
kmake
make DESTDIR="$DESTDIR" install
rm -f "$DESTDIR/usr/bin/pcre2-config"
'''
