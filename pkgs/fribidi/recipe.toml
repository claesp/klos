[package]
name = "fribidi"
version = "1.0.17"
summary = "Unicode bidirectional algorithm library"
license = "LGPL-2.1-or-later"
homepage = "https://github.com/fribidi/fribidi"
# Upstream signs the Git tag. kbuild compares the tarball with the signed
# Git tree (signature-type git-tag, docs/sources-and-keys.md).

[[source]]
# The archive of the signed Git tag (the release tarball adds generated
# documentation that the signature does not cover).
url = "https://github.com/fribidi/fribidi/archive/refs/tags/v1.0.17.tar.gz"
filename = "fribidi-1.0.17.tar.gz"
sha256 = "ab015bb040b2ff4bf815813c21948947dad1e0186473359e99a8881c79878d5d"
signature-type = "git-tag"
git = "https://github.com/fribidi/fribidi.git"
tag = "v1.0.17"
key = ["fribidi-dov"]

[build]
script = '''
kmeson -Ddocs=false -Dtests=false -Dbin=false
kninja
kninja_install
'''
